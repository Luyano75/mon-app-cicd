# .github/workflows/ci.yml

name: Continuous Integration and Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    # ... (le job build-and-test reste EXACTEMENT le même, pas besoin de le copier ici) ...
    # ... on le suppose inchangé et réussi ...
  
  # --- NOUVEAU JOB POUR LE DÉPLOIEMENT ---
  deploy:
    # Ce job ne démarre que si le job 'build-and-test' a réussi
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create dynamic inventory
        run: |
          # Remplace les virgules par des retours à la ligne
          echo "[webservers]" > inventory.ini
          echo "${{ secrets.SERVER_IPS }}" | tr ',' '\n' >> inventory.ini

      - name: Install Ansible and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible
          ansible-galaxy collection install community.docker

      - name: Run Ansible Playbook
        run: >
          ansible-playbook playbook.yml -i inventory.ini 
          -u ${{ secrets.SSH_USER }} 
          --extra-vars "dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}"
          --ssh-common-args='-o StrictHostKeyChecking=no'