# .github/workflows/ci.yml

name: Continuous Integration

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t mon-app .

      - name: Run container
        run: docker run -d --name test-container -p 8080:80 mon-app

      # NOUVELLE ÉTAPE : Attendre que le conteneur soit stable et vérifier son état
      - name: Wait for container and check logs
        run: |
          sleep 5
          echo "---- DOCKER CONTAINER STATUS ----"
          docker ps -a
          echo "---- DOCKER CONTAINER LOGS ----"
          docker logs test-container

      - name: Perform a health check
        run: |
          echo "Sending request to the application..."
          curl --fail http://localhost:8080 | grep "Hello, CI/CD World!"