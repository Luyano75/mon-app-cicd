# .github/workflows/ci.yml

name: Continuous Integration

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test: # Renommons le job pour être plus clair
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        # Nous donnons un nom simple et prévisible à l'image
        run: docker build -t mon-app .

      - name: Run container and perform a health check
        # Nous utilisons 'run' pour exécuter plusieurs commandes
        run: |
          # Démarrer le conteneur en arrière-plan (-d) et mapper le port 8080 de l'hôte au port 80 du conteneur
          docker run -d --name test-container -p 8080:80 mon-app
          
          # Attendre quelques secondes que le serveur Flask démarre
          sleep 5
          
          # Faire une requête HTTP et vérifier que la réponse contient bien "Hello, CI/CD World!"
          # Le 'grep' retournera un code d'erreur si le texte n'est pas trouvé, faisant échouer le step
        curl http://localhost:8080 | grep "Hello, CI/CD World!"