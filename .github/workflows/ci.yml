# .github/workflows/ci.yml

name: Continuous Integration and Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  # --- PREMIER JOB : BUILD ET TEST ---
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:latest .

      - name: Run container
        run: docker run -d --name test-container -p 8080:80 ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:latest

      - name: Wait for container and check logs
        run: |
          sleep 5
          echo "---- DOCKER CONTAINER STATUS ----"
          docker ps -a
          echo "---- DOCKER CONTAINER LOGS ----"
          docker logs test-container

      - name: Perform a health check
        run: curl --fail http://localhost:8080 | grep "Hello, CI/CD World!"
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:latest

  # --- SECOND JOB : DÉPLOIEMENT ---
  deploy:
    needs: build-and-test # Dépend du succès du premier job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/