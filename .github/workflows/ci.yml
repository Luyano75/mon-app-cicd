# .github/workflows/ci.yml

name: Continuous Integration and Delivery

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # --- L'étape de Build a été modifiée ---
      - name: Build Docker image
        # On tague l'image directement avec le nom attendu par Docker Hub
        # Format: VOTRE_USERNAME/NOM_IMAGE:TAG
        # On utilise github.sha pour un tag unique à chaque commit
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:latest .

      # --- Les étapes de test restent identiques ---
      - name: Run container
        # On utilise le tag 'latest' pour le test pour simplifier la commande
        run: docker run -d --name test-container -p 8080:80 ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:latest

      - name: Wait for container and check logs
        run: |
          sleep 5
          echo "---- DOCKER CONTAINER STATUS ----"
          docker ps -a
          echo "---- DOCKER CONTAINER LOGS ----"
          docker logs test-container

      - name: Perform a health check
        run: curl --fail http://localhost:8080 | grep "Hello, CI/CD World!"
      
      # --- NOUVELLES ÉTAPES POUR LE PUSH ---
      - name: Log in to Docker Hub
        # On utilise une action officielle pour se connecter
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        # On pousse les deux tags: le tag unique du commit et le tag 'latest'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mon-app-cicd:latest